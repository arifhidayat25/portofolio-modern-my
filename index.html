<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00d26a" />
    <meta name="description" content="Portofolio Achmad Arif Hidayat - Sarjana Sistem Informasi & IT Enthusiast. Web Development, Server Infrastructure, IT Support & Network Administration." />
    <title>Achmad Arif Hidayat | IT Enthusiast & Web Developer</title>

    <!-- Preload LCP Hero Image with Responsive Media Query for Instant Discovery -->
    <link
      rel="preload"
      as="image"
      href="/kacamata1-mobile.webp"
      type="image/webp"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/kacamata1.webp"
      type="image/webp"
      media="(min-width: 641px)"
      fetchpriority="high"
    />

    <!-- Google Fonts Non-Render-Blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
